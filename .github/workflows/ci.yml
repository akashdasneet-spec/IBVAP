name: IBVAP CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core-types
          pip install -e apps/central-gateway
          pip install -e apps/edge-engine
          pip install pytest pytest-asyncio anyio defusedxml httpx

      - name: Run Pytest Test Suite
        run: |
          pytest tests -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Dashboard
        env:
          NEXT_PUBLIC_GATEWAY_URL: "https://c2.ibvap.defense.mil"
          NEXT_PUBLIC_WS_URL: "wss://c2.ibvap.defense.mil/ws/v1/c2"
        run: pnpm --filter @ibvap/web-dashboard build
