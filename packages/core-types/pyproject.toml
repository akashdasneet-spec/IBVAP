[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibvap-core-types"
version = "1.0.0"
description = "Canonical Data Contracts for Intelligent Border Video Analytics Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ibvap_core_types"]
