[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibvap-workspace"
version = "1.0.0"
description = "Intelligent Border Video Analytics Platform (IBVAP) Modular Monolith"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal Defense Systems Architect", email = "architect@defense.internal" }
]
dependencies = []

[tool.uv.workspace]
members = [
    "packages/core-types",
    "apps/edge-engine",
    "apps/central-gateway"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core-types/src", "apps/edge-engine/src", "apps/central-gateway/src"]
