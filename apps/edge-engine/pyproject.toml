[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibvap-edge-engine"
version = "1.0.0"
description = "Hardware-Accelerated Edge Analytics Node for IBVAP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ibvap-core-types",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "opencv-python-headless>=4.9.0",
    "shapely>=2.0.4",
    "defusedxml>=0.7.1",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
