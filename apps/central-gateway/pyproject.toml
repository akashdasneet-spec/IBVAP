[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibvap-central-gateway"
version = "1.0.0"
description = "C2 Central Gateway & TAK Bridge for IBVAP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ibvap-core-types",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pgvector>=0.2.5",
    "pytak>=5.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
