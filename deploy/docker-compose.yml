version: '3.8'

services:
  # -------------------------------------------------------------------------
  # 1. PostgreSQL Database with pgvector & PostGIS
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ibvap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ibvap_tactical_db}
      POSTGRES_USER: ${POSTGRES_USER:-ibvap_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REDACTED_HISTORICAL_SECRET}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - ibvap-tactical-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibvap_admin} -d ${POSTGRES_DB:-ibvap_tactical_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # 2. Local IPFS Node (Kubo) for Cryptographic Snapshot Evidence
  # -------------------------------------------------------------------------
  ipfs:
    image: ipfs/kubo:v0.28.0
    container_name: ibvap-ipfs
    restart: unless-stopped
    environment:
      IPFS_PATH: /data/ipfs
    ports:
      - "4001:4001"             # P2P Swarm
      - "127.0.0.1:5001:5001"   # IPFS RPC API (Restricted to localhost / internal net)
      - "8080:8080"             # IPFS Gateway
    volumes:
      - ipfs_data:/data/ipfs
      - ipfs_staging:/export
    networks:
      - ibvap-tactical-net

  # -------------------------------------------------------------------------
  # 3. Central Gateway (FastAPI, WebSockets, PyTAK C2 Bridge)
  # -------------------------------------------------------------------------
  central-gateway:
    build:
      context: ..
      dockerfile: apps/central-gateway/Dockerfile.gateway
    container_name: ibvap-central-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ibvap_admin}:${POSTGRES_PASSWORD:-REDACTED_HISTORICAL_SECRET}@postgres:5432/${POSTGRES_DB:-ibvap_tactical_db}
      TAK_SERVER_URL: ${TAK_SERVER_URL:-udp://239.2.3.1:6969}
      IPFS_API_URL: http://ipfs:5001/api/v0
      EDGE_API_TOKEN: ${EDGE_API_TOKEN:-REDACTED_HISTORICAL_SECRET}
    ports:
      - "8000:8000"
    networks:
      - ibvap-tactical-net

  # -------------------------------------------------------------------------
  # 4. Edge Engine Node (NVIDIA TensorRT, GStreamer, PyTorch)
  # -------------------------------------------------------------------------
  edge-engine:
    build:
      context: ..
      dockerfile: apps/edge-engine/Dockerfile.edge
    container_name: ibvap-edge-engine
    restart: unless-stopped
    depends_on:
      - central-gateway
    environment:
      GATEWAY_URL: http://central-gateway:8000
      IPFS_API_URL: http://ipfs:5001/api/v0
      SENSOR_ID: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
      BOP_SECTOR_ID: BOP-SECTOR-ALPHA-01
      RTSP_URL: videotestsrc
      EDGE_API_TOKEN: ${EDGE_API_TOKEN:-REDACTED_HISTORICAL_SECRET}
      EVIDENCE_MASTER_KEY: ${EVIDENCE_MASTER_KEY:-REDACTED_HISTORICAL_KEY_OR_HASH}
    networks:
      - ibvap-tactical-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, utility]

  # -------------------------------------------------------------------------
  # 5. Tactical C2 Web Dashboard (Next.js 14, Tailwind, MapLibre GL)
  # -------------------------------------------------------------------------
  web-dashboard:
    build:
      context: ..
      dockerfile: apps/web-dashboard/Dockerfile.web
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/telemetry}
    container_name: ibvap-web-dashboard
    restart: unless-stopped
    depends_on:
      - central-gateway
    environment:
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/telemetry}
    ports:
      - "3000:3000"
    networks:
      - ibvap-tactical-net

# ---------------------------------------------------------------------------
# Zero-Config Isolated Tactical Bridge Network
# ---------------------------------------------------------------------------
networks:
  ibvap-tactical-net:
    driver: bridge
    name: ibvap-tactical-net
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ---------------------------------------------------------------------------
# Persistent Storage Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    name: ibvap-postgres-data
  ipfs_data:
    name: ibvap-ipfs-data
  ipfs_staging:
    name: ibvap-ipfs-staging
